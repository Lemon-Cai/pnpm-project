<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mapbox Draw Circle Example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.6.1/mapbox-gl.css" rel="stylesheet" />
  <!-- <link href="https://api.mapbox.com/mapbox-gl-draw/v1.2.0/mapbox-gl-draw.css" rel="stylesheet" /> -->
  <link rel='stylesheet' href='https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.3/mapbox-gl-draw.css' type='text/css' />

  <script src="https://api.mapbox.com/mapbox-gl-js/v2.6.1/mapbox-gl.js"></script>
  <!-- <script src="https://api.mapbox.com/mapbox-gl-draw/v1.2.0/mapbox-gl-draw.js"></script> -->
  <script src='https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.3/mapbox-gl-draw.js'></script>

  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
<div id="map"></div>
<script>
  mapboxgl.accessToken = 'pk.eyJ1IjoiY2FpcCIsImEiOiJjazJ2NWs4MjAwMWduM2xwOGM3MjBsbGw0In0.ddkf0hABZBhgBxbLg0-gpw';

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/streets-v11',
    center: [118.65, 32.44],
    zoom: 12
  });

  const draw = new MapboxDraw({
    displayControlsDefault: false,
    controls: {
      polygon: true,
      trash: true
    }
  });

  map.addControl(draw);

  map.on('draw.create', updateCircleColor);
  map.on('draw.update', updateCircleColor);

  function updateCircleColor(e) {
    const data = draw.getAll();
    const features = data.features;

    if (features.length > 0) {
      const circleFeature = features[0];
      const circleId = circleFeature.id;

      map.setPaintProperty('gl-draw-polygon-fill', 'fill-color', '#FF0000');
      map.setPaintProperty('gl-draw-polygon-stroke', 'line-color', '#FF0000');
    }
  }
</script>
</body>
</html>
